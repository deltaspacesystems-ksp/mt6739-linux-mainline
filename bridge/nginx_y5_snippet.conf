# Fragment nginx dla mostu do telefonu i sterowania PC. SZABLON: znaczniki podmieniasz poleceniem z docs/KLUCZE_I_ZMIENNE.md,
# wynik (z tokenami) zapisz jako y5_locations.conf, NIE commituj go. Wlacz w bloku server { listen 443 ssl; ... }:  include y5_locations.conf;
#
# --- Strefy limitow: wstaw w bloku http { ... } (raz) -----------------------------------------------------------------
#   limit_req_zone  $http_cf_connecting_ip zone=y5_req:1m  rate=5r/s;
#   limit_conn_zone $http_cf_connecting_ip zone=y5_conn:1m;
#   # lista adresow Cloudflare (https://www.cloudflare.com/ips/) do mapy: 1 = ruch z Cloudflare
#   geo $y5_from_cf { default 0; include cloudflare_ips.conf; }     # plik w formacie "173.245.48.0/20 1;" itd.
# ---------------------------------------------------------------------------------------------------------------------

# Most do telefonu (bridge_server.py na PC z telefonem). Warstwy: tylko Cloudflare -> tajna sciezka -> token -> GET/POST -> limity.
# Kazde odrzucenie = 444 (zamkniete polaczenie bez odpowiedzi). bridge_server.py sprawdza dodatkowo podpis zadania (klucza podpisu tu nie ma).
location ^~ __Y5_PATH__ {
    if ($y5_from_cf = 0) { return 444; }
    if ($http_authorization != "Bearer __Y5_TOKEN__") { return 444; }

    limit_except GET POST { deny all; }
    limit_req            zone=y5_req burst=10 nodelay;
    limit_conn           y5_conn 5;
    limit_req_status     429;
    limit_conn_status    429;

    client_max_body_size 64m;
    proxy_request_buffering off;
    proxy_pass           http://IP_PC_Z_MOSTEM:2324/;          # adres LAN PC z telefonem
    proxy_http_version   1.1;
    proxy_set_header     Host $host;
    proxy_set_header     Authorization $http_authorization;
    proxy_set_header     X-Real-IP $http_cf_connecting_ip;
    proxy_read_timeout   100s;        # Cloudflare i tak ucina po 100 s
    proxy_send_timeout   100s;
    add_header           Cache-Control "no-store" always;
    access_log           logs/y5.log;
}

# Sterowanie PC (PowerShell): dziala tylko, gdy most jest uruchomiony z -Pc. Inny token i sciezka niz do telefonu.
location ^~ __PC_PATH__ {
    if ($y5_from_cf = 0) { return 444; }
    if ($http_authorization != "Bearer __PS_TOKEN__") { return 444; }

    limit_except GET POST { deny all; }
    limit_req            zone=y5_req burst=10 nodelay;
    limit_conn           y5_conn 5;
    limit_req_status     429;
    limit_conn_status    429;

    client_max_body_size 100m;
    proxy_request_buffering off;
    proxy_pass           http://IP_PC_Z_MOSTEM:2324/pc/;
    proxy_http_version   1.1;
    proxy_set_header     Host $host;
    proxy_set_header     Authorization $http_authorization;
    proxy_set_header     X-Real-IP $http_cf_connecting_ip;
    proxy_read_timeout   100s;
    proxy_send_timeout   100s;
    add_header           Cache-Control "no-store" always;
    access_log           logs/pc.log;
}
